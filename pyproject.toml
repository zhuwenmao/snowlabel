[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowlabel"
version = "0.1.0"
description = "Progressive mask auto-labeling with SAM, DINO feature memory, and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhuwenmao" }]
keywords = ["labeling", "annotation", "sam", "dino", "milvus", "label-studio", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime deps. ML and evaluation packages live in requirements.txt so
# PyTorch can be installed from the matching CUDA wheel index first.
dependencies = [
    "numpy~=2.4.4",
    "Pillow~=12.2.0",
    "fastapi~=0.136.3",
    "uvicorn[standard]~=0.48.0",
    "python-multipart~=0.0.29",
    "requests~=2.32.5",
    "pydantic~=2.13.4",
    "tqdm~=4.67.3",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.4.2",
    "ruff~=0.15.21",
]

[project.scripts]
snowlabel = "snowlabel.server:run"

[tool.setuptools.packages.find]
include = ["snowlabel*"]
exclude = ["data*", "results*", "notebooks*", "scripts*"]

[tool.setuptools.package-data]
snowlabel = ["static/*.html", "static/hero/*.webp", "static/guide/*.webp"]
