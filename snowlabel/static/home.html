<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnowLabel · 越标越准的自动标注</title>
<style>
  :root{--bg:#050609;--panel:#11141b;--panel2:#171b24;--fg:#f4f6fb;--muted:#a2a9b6;--line:#272d39;
        --accent:#3880F3;--accent2:#FB73A5;--auto:#28D232;--suggest:#F0AA19;--manual:#8F8CFF;
        --grad:linear-gradient(135deg,#595FEF 0%,#FB73A5 100%)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Inter","Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .hero{min-height:86svh;position:relative;overflow:hidden;background:#050609;padding-bottom:42px}
  .hero::before{content:"";position:absolute;inset:0;background:
    linear-gradient(115deg,rgba(56,128,243,.12),transparent 38%),
    linear-gradient(24deg,transparent 55%,rgba(251,115,165,.08));
    pointer-events:none}
  nav{height:72px;display:flex;align-items:center;gap:24px;padding:0 max(32px,6vw);position:relative;z-index:3}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .snow{font-size:20px}
  .navlinks{margin-left:auto;display:flex;align-items:center;gap:26px;color:var(--fg);font-size:14px;font-weight:700}
  .navlinks a{opacity:.9}
  .navlinks a:hover{text-decoration:underline}
  .hint{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
        background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800;
        cursor:help;vertical-align:super;margin-left:6px}
  .hint:hover{color:var(--fg);border-color:var(--accent)}
  /* ---- hero:三张真实图 + 真实 SAM 轮廓,讲"教一次 → 建议 → 自动命中" ---- */
  .heroScene{position:relative;z-index:1;width:min(1040px,calc(100% - 96px));margin:56px auto 0}
  .flow{display:grid;grid-template-columns:1fr 52px 1fr 52px 1fr;align-items:center}
  .shot{--c:var(--manual);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        box-shadow:0 18px 50px rgba(0,0,0,.38)}
  .shot.s{--c:var(--suggest)}.shot.a{--c:var(--auto)}
  .shot.a{border-color:rgba(40,210,50,.45);box-shadow:0 18px 50px rgba(0,0,0,.38),0 0 0 1px rgba(40,210,50,.18),0 0 40px rgba(40,210,50,.10)}
  .media{position:relative;aspect-ratio:4/3;background:#0b0d12}
  .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .media svg{position:absolute;inset:0;width:100%;height:100%}
  .media polygon{fill:var(--c);fill-opacity:.16;stroke:var(--c);stroke-width:2.5px;stroke-linejoin:round;
                 vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
  .tag{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
       background:rgba(5,6,9,.78);border:1px solid var(--c);color:#fff;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
  .tag i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
  .cap{display:flex;align-items:baseline;gap:8px;padding:11px 14px 12px;border-top:1px solid var(--line)}
  .cap .k{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
  .cap b{font-size:14px;color:var(--c);white-space:nowrap}
  .cap span{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
  .arrow{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}
  .arrow svg{width:22px;height:22px;stroke:currentColor}
  .note{margin:14px 0 0;text-align:center;color:#6f7684;font-size:12px}
  @media (prefers-reduced-motion:no-preference){
    .media polygon{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
    .shot.s polygon{animation-delay:.35s}.shot.a polygon{animation-delay:.7s}
    @keyframes draw{to{stroke-dashoffset:0}}
  }
  .copy{position:relative;z-index:2;width:min(860px,calc(100% - 96px));margin:62px auto 0;text-align:center}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:20px;text-transform:uppercase;letter-spacing:0}
  .eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--auto);box-shadow:0 0 16px var(--auto)}
  h1{font-size:72px;line-height:1.05;margin:0 auto 20px;font-weight:800;letter-spacing:0;max-width:860px}
  .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{font-size:24px;line-height:1.42;color:var(--fg);margin:0 auto 32px;max-width:720px}
  .actions{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
  .primary{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:0 30px;border-radius:999px;border:2px solid transparent;background:linear-gradient(#050609,#050609) padding-box,var(--grad) border-box;font-weight:800;font-size:17px;box-shadow:0 0 34px rgba(89,95,239,.24)}
  .primary:hover{background:var(--grad)}
  .secondary{font-size:15px;color:var(--muted);font-weight:700}
  .secondary:hover{color:var(--fg);text-decoration:underline}
  .section{background:#0b0d12;border-top:1px solid var(--line);padding:68px 32px 84px}
  .inner{max-width:1180px;margin:0 auto}
  .section h2{font-size:30px;line-height:1.2;margin:0 0 30px}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;min-height:150px}
  .step .n{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:var(--panel2);color:var(--fg);font-weight:800;margin-bottom:24px}
  .step b{display:block;font-size:19px;margin-bottom:10px}
  .step p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
  footer{background:#050609;border-top:1px solid var(--line);padding:24px 28px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  @media (max-width:760px){
    nav{height:66px;padding:0 20px}.navlinks{gap:14px;font-size:13px}.navlinks a:nth-child(2){display:none}
    .hero{min-height:88svh;padding-bottom:32px}
    .copy{width:calc(100% - 40px);margin:46px auto 0;text-align:left}
    .eyebrow{margin-bottom:18px}
    h1{font-size:44px;line-height:1.08;margin-left:0;margin-right:0}
    .lead{font-size:18px;margin-left:0;margin-right:0}
    .actions{justify-content:flex-start}
    .heroScene{width:100%;margin-top:40px}
    .flow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px 6px;scrollbar-width:none}
    .flow::-webkit-scrollbar{display:none}
    .shot{flex:0 0 78%;scroll-snap-align:center}
    .arrow{display:none}
    .note{padding:0 20px;text-align:left}
    .steps{grid-template-columns:1fr}
    .section{padding:54px 20px 68px}
  }
</style>
</head>
<body>
<main class="hero">
  <nav>
    <a class="brand" href="/"><span class="snow">&#10052;&#65039;</span><span>SnowLabel</span></a>
    <div class="navlinks">
      <a href="/try?guide=1&fresh=1">立即尝试 ↗</a>
      <a href="https://github.com/zhuwenmao/snowlabel" target="_blank" rel="noreferrer">GitHub ↗</a>
    </div>
  </nav>
  <section class="copy">
    <div class="eyebrow">渐进式自动标注 demo</div>
    <h1><span class="grad">越标越准</span>的自动标注</h1>
    <p class="lead">先分割整张图，再把确认过的类别变成可复用记忆。</p>
    <div class="actions">
      <a class="primary" href="/try?guide=1&fresh=1">立即尝试</a>
      <a class="secondary" href="#how">查看流程</a>
    </div>
  </section>
  <div class="heroScene">
    <div class="flow">
      <figure class="shot" style="margin:0">
        <div class="media">
          <img src="/static/hero/bus-1.webp" alt="第一张图：手动确认公交车">
          <svg viewBox="0 0 612 612" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><polygon pathLength="1" points="153,119 142,149 132,303 136,457 155,526 179,529 192,518 221,516 225,506 329,492 344,500 351,525 369,531 400,514 403,495 481,476 493,489 511,458 503,325 517,299 496,183 319,91 218,96"/></svg>
          <span class="tag"><i></i>公交车 · 入库</span>
        </div>
        <figcaption class="cap"><span class="k">第 1 张</span><b>你来教</b><span>点选确认，写入记忆</span></figcaption>
      </figure>
      <div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>记忆</div>
      <figure class="shot s" style="margin:0">
        <div class="media">
          <img src="/static/hero/bus-2.webp" alt="相似图：建议确认公交车">
          <svg viewBox="0 0 640 406" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><polygon pathLength="1" points="335,39 285,105 272,105 263,121 253,113 262,131 240,140 236,154 220,156 205,285 216,316 256,335 279,369 288,366 329,389 538,377 528,245 538,257 540,208 526,185 518,74 460,47 441,50 439,41 425,48 363,35"/></svg>
          <span class="tag"><i></i>公交车？</span>
        </div>
        <figcaption class="cap"><span class="k">相似图</span><b>建议确认</b><span>不确定的交给你</span></figcaption>
      </figure>
      <div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>复用</div>
      <figure class="shot a" style="margin:0">
        <div class="media">
          <img src="/static/hero/bus-3.webp" alt="后续图：自动识别公交车">
          <svg viewBox="0 0 640 427" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><polygon pathLength="1" points="351,52 190,53 189,68 108,87 107,115 93,136 95,164 102,170 114,286 125,324 146,353 153,336 304,311 318,318 324,310 337,320 341,310 346,321 361,328 384,313 383,303 397,293"/></svg>
          <span class="tag"><i></i>公交车</span>
        </div>
        <figcaption class="cap"><span class="k">之后</span><b>自动命中</b><span>学过的直接认出</span></figcaption>
      </figure>
    </div>
    <p class="note">轮廓为 SAM 2.1 真实分割结果；三档流程为示意。</p>
  </div>
</main>
<section class="section" id="how">
  <div class="inner">
    <h2>使用流程</h2>
    <div class="steps">
      <div class="step"><span class="n">1</span><b>选图并全分割</b><p>上传图片，或直接使用示例数据集。</p></div>
      <div class="step"><span class="n">2</span><b>确认类别</b><p>只保存新增和纠错样本。<span class="hint" title="识别正确的结果不会重复写入记忆，避免同一张图反复污染样本。">?</span></p></div>
      <div class="step"><span class="n">3</span><b>自动复用</b><p>下一张相似图会优先调用已确认的记忆。</p></div>
    </div>
  </div>
</section>
<footer>
  <span>SnowLabel demo <span class="hint" title="公网试用按浏览器隔离上传图片和记忆；重新开始只影响当前浏览器会话。">?</span></span>
  <span><a href="https://github.com/zhuwenmao/snowlabel" target="_blank" rel="noreferrer">GitHub</a> &nbsp; <a href="/try?guide=1&fresh=1">开始试用</a></span>
</footer>
</body>
</html>
